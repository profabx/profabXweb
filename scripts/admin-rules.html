<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProFabX 规则文档管理</title><style>body{font:16px system-ui;margin:30px auto;padding:0 24px;max-width:1100px;color:#26364d}button,select,a{margin:8px;padding:10px;color:#0054ff}textarea{width:100%;box-sizing:border-box;height:65vh;padding:18px;border:1px solid #c7d7f4;font:14px/1.7 monospace}p{line-height:1.7}button{cursor:pointer}#status{white-space:pre-wrap}#preview{line-height:1.9;overflow-wrap:anywhere}#preview h1{font-size:28px}#preview h2{margin-top:30px}#preview blockquote{margin:20px 0;padding:18px 24px;border:1px solid #a9c4ff;border-left:5px solid #0054ff;background:#eef4ff;border-radius:8px;color:#243e68}#preview pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;border:1px solid #dbe4f0;padding:16px;border-radius:6px}#preview blockquote strong{color:#0048d9}#preview table{border-collapse:collapse;width:100%;font-size:14px}#preview th,#preview td{border:1px solid #d3def0;padding:8px;text-align:left}#preview th{background:#eef4ff}.table-wrap{overflow-x:auto}button[aria-pressed=true]{background:#0054ff;color:#fff;border:1px solid #0054ff}[hidden]{display:none!important}</style><body><p id="admin-rule-preview-notice" hidden>当前为公开版预览，规则编辑仅管理版可用。<a href="/prototype.html">查看公开版工作台</a></p><main id="admin-rule-editor"><h1>规则文档管理</h1><p id="description"></p><a href="/prototype.html">返回管理工作台</a><p>草稿保存在本机 .rule-drafts，原文更新时自动备份。校验仅检查文档结构；修改正式文档不会自动改变网站的计价与风险代码，规则逻辑需另行实现、测试和发布。</p><label>文档<select id="file"><option value="quotation.md">报价规则 · quotation.md</option><option value="risk.md">风险判断规则 · risk.md</option></select></label><button id="load">重新读取</button><button id="draft">恢复已保存草稿</button><div><button id="read-mode" aria-pressed="true">阅读预览</button><button id="edit-mode" aria-pressed="false">编辑 Markdown</button></div><article id="preview" aria-label="规则阅读预览"></article><textarea hidden id="editor" aria-label="规则 Markdown 内容"></textarea><div><button id="save">保存草稿</button><button id="validate">校验草稿</button><button id="apply">应用到正式文档</button></div><p id="status" role="status"></p></main><script src="/admin-view.js" defer></script><script>
let token,baseHash,savedDraft;const initialFile=new URLSearchParams(location.search).get('file');if(['quotation.md','risk.md'].includes(initialFile))document.getElementById('file').value=initialFile;let loadRevision=0;const el=id=>document.getElementById(id),status=t=>el('status').textContent=t;
const escapeText=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inline=s=>escapeText(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function render(){const lines=el('editor').value.split(/\r?\n/);let out='',i=0;while(i<lines.length){const l=lines[i];if(l.startsWith('```')){const code=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);i++;out+='<pre>'+escapeText(code.join('\n'))+'</pre>';continue;}if(l.startsWith('>')){const block=[];while(i<lines.length&&lines[i].startsWith('>')){const text=lines[i++].replace(/^> ?/,'');if(!/^\[!IMPORTANT\]/.test(text))block.push(text);}out+='<blockquote>'+block.filter(Boolean).map(t=>'<p>'+inline(t)+'</p>').join('')+'</blockquote>';continue;}if(l.trim().startsWith('|')){const rows=[];while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(lines[i++]);const cells=t=>t.trim().replace(/^\||\|$/g,'').split('|');out+='<div class="table-wrap"><table>'+rows.filter(t=>!/^\|?[ :|-]+\|?$/.test(t.trim())).map((t,j)=>'<tr>'+cells(t).map(c=>'<'+(j?'td':'th')+'>'+inline(c.trim())+'</'+(j?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';continue;}const h=/^(#{1,4}) (.*)/.exec(l);if(h)out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';else if(l.trim()==='---')out+='<hr>';else if(l.trim())out+='<p>'+inline(l)+'</p>';i++;}el('preview').innerHTML=out;}
function mode(edit){el('editor').hidden=!edit;el('preview').hidden=edit;el('edit-mode').setAttribute('aria-pressed',String(edit));el('read-mode').setAttribute('aria-pressed',String(!edit));if(!edit)render();}
async function load(){const revision=++loadRevision;try{token=(await(await fetch('/api/admin/session')).json()).token;const r=await fetch('/api/admin/read?file='+el('file').value),v=await r.json();if(!r.ok)throw Error(v.error);if(revision!==loadRevision)return;baseHash=v.hash;savedDraft=v.draft;el('editor').value=v.content;el('description').textContent=el('file').value==='quotation.md'?'quotation.md：说明零件如何计价，包括费率、重量、起步价、后处理和人工核价。':'risk.md：说明零件何时报警，包括壁厚、设备范围、悬垂、桥接、切片和 LCD 内腔风险。';mode(false);status('已读取正式文档'+(savedDraft?'，可恢复已保存草稿。':'。'));}catch(e){status(e.message);}}
async function action(name){try{const r=await fetch('/api/admin/'+name+'?file='+el('file').value,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({baseHash,content:el('editor').value})}),v=await r.json();if(!r.ok)throw Error(v.error||v.errors?.join('；'));if(v.applied){baseHash=v.hash;status('正式文档已更新并备份。程序规则尚未改变，请安排实现与测试。');}else status(v.validated?'草稿结构校验通过，可应用到正式文档。':'草稿已保存。');}catch(e){status(e.message);}}
el('read-mode').onclick=()=>mode(false);el('edit-mode').onclick=()=>mode(true);el('editor').oninput=render;el('load').onclick=load;el('file').onchange=load;el('draft').onclick=()=>{if(savedDraft){el('editor').value=savedDraft.content;mode(false);status('已恢复草稿，请检查后保存或校验。');}else status('暂无草稿');};for(const n of ['save','validate','apply'])el(n).onclick=()=>action(n);load();</script></body></html>
