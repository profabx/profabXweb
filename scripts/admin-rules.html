<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProFabX 规则文档管理</title><style>body{font:16px system-ui;margin:30px auto;padding:0 24px;max-width:1100px;color:#26364d}button,select,a{margin:8px;padding:10px;color:#0054ff}textarea{width:100%;box-sizing:border-box;height:65vh;padding:18px;border:1px solid #c7d7f4;font:14px/1.7 monospace}p{line-height:1.7}button{cursor:pointer}#status{white-space:pre-wrap}</style><h1>报价与风险规则文档</h1><a href="/prototype.html">返回管理工作台</a><p>草稿保存在本机 .rule-drafts，原文更新时自动备份。校验仅检查文档结构；修改正式文档不会自动改变网站的计价与风险代码，规则逻辑需另行实现、测试和发布。</p><label>文档<select id="file"><option>quotation.md</option><option>risk.md</option></select></label><button id="load">重新读取</button><button id="draft">恢复已保存草稿</button><textarea id="editor" aria-label="规则 Markdown 内容"></textarea><div><button id="save">保存草稿</button><button id="validate">校验草稿</button><button id="apply">应用到正式文档</button></div><p id="status" role="status"></p><script>
let token,baseHash,savedDraft;const el=id=>document.getElementById(id),status=t=>el('status').textContent=t;
async function load(){try{token=(await(await fetch('/api/admin/session')).json()).token;const r=await fetch('/api/admin/read?file='+el('file').value),v=await r.json();if(!r.ok)throw Error(v.error);baseHash=v.hash;savedDraft=v.draft;el('editor').value=v.content;status('已读取正式文档'+(savedDraft?'，可恢复已保存草稿。':'。'));}catch(e){status(e.message);}}
async function action(name){try{const r=await fetch('/api/admin/'+name+'?file='+el('file').value,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({baseHash,content:el('editor').value})}),v=await r.json();if(!r.ok)throw Error(v.error||v.errors?.join('；'));if(v.applied){baseHash=v.hash;status('正式文档已更新并备份。程序规则尚未改变，请安排实现与测试。');}else status(v.validated?'草稿结构校验通过，可应用到正式文档。':'草稿已保存。');}catch(e){status(e.message);}}
el('load').onclick=load;el('file').onchange=load;el('draft').onclick=()=>{if(savedDraft){el('editor').value=savedDraft.content;status('已恢复草稿，请检查后保存或校验。');}else status('暂无草稿');};for(const n of ['save','validate','apply'])el(n).onclick=()=>action(n);load();</script></html>
