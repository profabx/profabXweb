name: Deploy ProFabX website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Desktop preview lock integration tests require Windows PowerShell.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        shell: pwsh
        run: |
          pnpm test 2>&1 | Tee-Object -FilePath ci-test-output.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Select-String -Path ci-test-output.log -Pattern '^not ok |^✖ |^# (Error|AssertionError)|^  error:' |
              Select-Object -Last 20 |
              ForEach-Object { Write-Host ("::error::" + $_.Line.Replace('%', '%25')) }
            exit $testExit
          }
      - run: pnpm build
      - run: pnpm run build:admin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
